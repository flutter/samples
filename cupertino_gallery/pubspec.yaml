name: cupertino_gallery
description: A Flutter project showcasing supported Cupertino components.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.14.0-0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  cupertino_ui: any
  material_ui: any
dev_dependencies:
  analysis_defaults:
    path: ../analysis_defaults
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true